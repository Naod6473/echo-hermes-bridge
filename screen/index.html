<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Hermes</title>
<!-- Fonts load from Google when the TV has internet; the system fonts below take over otherwise. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='url(%23g)' stroke-width='7'/%3E%3C/svg%3E">
<style>
@property --c1 { syntax: "<color>"; inherits: true; initial-value: #38bdf8; }
@property --c2 { syntax: "<color>"; inherits: true; initial-value: #8b5cf6; }
@property --glow { syntax: "<number>"; inherits: true; initial-value: 0.55; }

:root {
  --bg: #060816;
  --ink: #eef0ff;
  --ink-2: #b7bce6;
  --ink-3: #7c82b3;
  --line: rgba(160, 170, 255, 0.10);
  --glass: rgba(140, 150, 255, 0.045);
  --cyan: #22d3ee;
  --violet: #a78bfa;
  --gold: #fbbf24;
  --orb: min(46vh, 34vw);
  --sans: "Inter", "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  cursor: none;
  transition: --c1 .9s var(--ease), --c2 .9s var(--ease), --glow .9s var(--ease);
}

/* state palette */
body[data-state="idle"]      { --c1: #38bdf8; --c2: #8b5cf6; --glow: .5; }
body[data-state="listening"] { --c1: #22d3ee; --c2: #3b82f6; --glow: 1; }
body[data-state="thinking"]  { --c1: #a78bfa; --c2: #f0abfc; --glow: .85; }
body[data-state="speaking"]  { --c1: #67e8f9; --c2: #a78bfa; --glow: 1; }
body[data-state="error"]     { --c1: #fb7185; --c2: #f472b6; --glow: .8; }

/* ------------------------------------------------------------------ backdrop */
.sky { position: fixed; inset: 0; pointer-events: none; }
.sky::before {
  content: ""; position: absolute; inset: -20%;
  background:
    radial-gradient(40% 45% at 18% 22%, color-mix(in srgb, var(--c2) 26%, transparent), transparent 70%),
    radial-gradient(45% 50% at 88% 92%, color-mix(in srgb, var(--c1) 16%, transparent), transparent 70%),
    radial-gradient(60% 60% at 50% 120%, rgba(76, 29, 149, .35), transparent 70%);
  opacity: calc(.55 + var(--glow) * .45);
  animation: drift 40s ease-in-out infinite alternate;
}
.sky::after {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(180, 190, 255, .09) 1px, transparent 1.2px);
  background-size: 3.2vh 3.2vh;
  -webkit-mask-image: radial-gradient(70% 70% at 50% 45%, #000 30%, transparent 85%);
          mask-image: radial-gradient(70% 70% at 50% 45%, #000 30%, transparent 85%);
}
@keyframes drift { to { transform: translate3d(3%, -2%, 0) scale(1.05); } }

/* ------------------------------------------------------------------ layout */
.stage {
  position: fixed; inset: 0;
  padding: 5.5vh 6vw 5vh;
  display: grid; grid-template-rows: auto 1fr auto; gap: 3vh;
  transition: transform 6s ease-in-out;
}
header { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 1.4vh; }
.brand .mark {
  width: 3.4vh; height: 3.4vh; border-radius: 50%;
  background: conic-gradient(from 200deg, var(--c1), var(--c2), var(--c1));
  -webkit-mask: radial-gradient(farthest-side, transparent 58%, #000 62%);
          mask: radial-gradient(farthest-side, transparent 58%, #000 62%);
}
.brand .name { font-family: var(--mono); font-size: 2vh; letter-spacing: .5em; color: var(--ink-2); }
.top-right { display: flex; align-items: center; gap: 2.4vh; }
.pill {
  display: inline-flex; align-items: center; gap: 1vh;
  padding: .9vh 1.8vh; border-radius: 99px;
  border: 1px solid var(--line); background: var(--glass);
  font-family: var(--mono); font-size: 1.6vh; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
}
.pill .dot { width: 1vh; height: 1vh; border-radius: 50%; background: #34d399; box-shadow: 0 0 1.2vh #34d399; }
.pill.off .dot { background: #f59e0b; box-shadow: 0 0 1.2vh #f59e0b; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.clock-small { font-size: 3vh; font-weight: 300; color: var(--ink-2); font-variant-numeric: tabular-nums; transition: opacity .6s; }
body[data-state="idle"] .clock-small { opacity: 0; }

main { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6vw; min-height: 0; }

/* ------------------------------------------------------------------ orb */
.orb { position: relative; width: var(--orb); aspect-ratio: 1; --level: 0; }
.orb > * { position: absolute; inset: 0; border-radius: 50%; }
.halo {
  inset: -38%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--c1) 38%, transparent), color-mix(in srgb, var(--c2) 14%, transparent) 55%, transparent 75%);
  opacity: calc(.35 + var(--glow) * .45 + var(--level) * .35);
  transform: scale(calc(.92 + var(--level) * .22));
  transition: transform .12s linear;
  animation: breathe 6s ease-in-out infinite;
}
@keyframes breathe { 50% { opacity: calc(.25 + var(--glow) * .4); } }
.ring {
  background: conic-gradient(from 0deg, var(--c1), var(--c2) 35%, transparent 52%, var(--c1) 70%, var(--c2) 88%, var(--c1));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.5vh), #000 calc(100% - 1.3vh));
          mask: radial-gradient(farthest-side, transparent calc(100% - 1.5vh), #000 calc(100% - 1.3vh));
  animation: spin 14s linear infinite;
  filter: drop-shadow(0 0 1.6vh color-mix(in srgb, var(--c1) 70%, transparent));
}
.ring.two {
  inset: 7%;
  background: conic-gradient(from 180deg, transparent, var(--c2) 20%, transparent 40%, var(--c1) 70%, transparent 85%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - .45vh), #000 calc(100% - .35vh));
          mask: radial-gradient(farthest-side, transparent calc(100% - .45vh), #000 calc(100% - .35vh));
  animation: spin 9s linear infinite reverse;
  opacity: .8; filter: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
.core {
  inset: 17%; overflow: hidden;
  background:
    radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c1) 40%, #0b1030) 0%, color-mix(in srgb, var(--c2) 35%, #0b1030) 50%, #0a0d24 80%);
  box-shadow:
    inset 0 0 6vh color-mix(in srgb, var(--c2) 55%, transparent),
    inset -2vh -3vh 6vh rgba(0, 0, 0, .55),
    0 0 8vh color-mix(in srgb, var(--c1) 30%, transparent);
  transform: scale(calc(1 + var(--level) * .16));
  transition: transform .09s linear;
}
.core .blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
.core .blob.a { inset: 5% 25% 35% 0; background: radial-gradient(closest-side, color-mix(in srgb, var(--c1) 85%, white), transparent); animation: swirl 7s ease-in-out infinite; }
.core .blob.b { inset: 35% 0 0 30%; background: radial-gradient(closest-side, var(--c2), transparent); animation: swirl 9s ease-in-out infinite reverse; }
.core .blob.c { inset: 30% 30% 30% 30%; background: radial-gradient(closest-side, rgba(255,255,255,.9), transparent); opacity: calc(.25 + var(--level) * .75); }
.core .shine { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 33% 26%, rgba(255,255,255,.5), transparent 16%); }
@keyframes swirl { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(18%, 10%) scale(1.15); } 66% { transform: translate(-6%, 20%) scale(.9); } }
body[data-state="thinking"] .core .blob { animation-duration: 2.2s; }
.core::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 90deg, transparent, rgba(255,255,255,.10), transparent 30%, transparent 60%, rgba(255,255,255,.07), transparent);
  animation: spin 7s linear infinite;
}
.ripple { border: .25vh solid var(--c1); opacity: 0; }
body[data-state="listening"] .ripple { animation: ripple 2.1s var(--ease) infinite; }
body[data-state="listening"] .ripple.b { animation-delay: .7s; }
body[data-state="listening"] .ripple.c { animation-delay: 1.4s; }
@keyframes ripple { 0% { transform: scale(.85); opacity: .7; } 100% { transform: scale(1.55); opacity: 0; } }

body[data-state="listening"] .ring { animation-duration: 4s; }
body[data-state="thinking"] .ring { animation-duration: 1.6s; }
body[data-state="thinking"] .ring.two { animation-duration: 1.1s; }
body[data-state="speaking"] .ring { animation-duration: 6s; }
body[data-state="idle"] .core { animation: idlecore 6s ease-in-out infinite; }
@keyframes idlecore { 50% { transform: scale(.96); } }

.orbit { animation: spin 3s linear infinite; opacity: 0; transition: opacity .6s; }
body[data-state="thinking"] .orbit { opacity: 1; }
.orbit i {
  position: absolute; width: 1.3vh; height: 1.3vh; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 2vh var(--gold), 0 0 .6vh #fff;
  top: -0.65vh; left: calc(50% - .65vh);
}
.orbit.b { animation-duration: 4.6s; animation-direction: reverse; inset: 9%; }
.orbit.b i { background: #f0abfc; box-shadow: 0 0 2vh #f0abfc; width: .9vh; height: .9vh; }

/* avatar (replaces the orb when an avatar.json is installed and a style is picked) */
.avatar { display: none; width: calc(var(--orb) * 1.5); max-width: 100%; aspect-ratio: 1; margin: calc(var(--orb) * -0.25) calc(var(--orb) * -0.2); }
body.has-avatar .avatar { display: block; }
body.has-avatar .orb { display: none; }

/* ------------------------------------------------------------------ text */
.copy { position: relative; min-width: 0; height: 100%; display: grid; align-items: center; }
.panel { grid-area: 1 / 1; transition: opacity .7s var(--ease), transform .7s var(--ease); }
.panel[hidden] { display: block; opacity: 0; transform: translateY(2vh); pointer-events: none; }

.label {
  display: inline-flex; align-items: center; gap: 1.4vh;
  font-family: var(--mono); font-size: 2vh; letter-spacing: .32em; text-transform: uppercase;
  color: var(--c1);
}
.label .bars { display: inline-flex; gap: .5vh; align-items: center; height: 2.2vh; }
.label .bars i { width: .45vh; height: 100%; border-radius: 1vh; background: currentColor; transform-origin: center; animation: eq 1s ease-in-out infinite; }
.label .bars i:nth-child(2) { animation-delay: -.25s; } .label .bars i:nth-child(3) { animation-delay: -.5s; } .label .bars i:nth-child(4) { animation-delay: -.75s; }
@keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

.heard {
  margin-top: 3vh; font-size: 3.3vh; line-height: 1.35; font-weight: 300; color: var(--ink-2);
  max-width: 52ch; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.heard:not(:empty)::before { content: "“"; color: var(--c1); margin-right: .15em; }
.heard:not(:empty)::after { content: "”"; color: var(--c1); margin-left: .1em; }
:lang(fr) .heard:not(:empty)::before { content: "« "; }
:lang(fr) .heard:not(:empty)::after { content: " »"; }
.hint { display: flex; gap: 1.6vh; flex-wrap: wrap; }
.hint .pill.soft { color: var(--ink-3); }
.reply {
  margin-top: 3.4vh; font-weight: 600; letter-spacing: -.02em; line-height: 1.16;
  font-size: var(--reply-size, 6vh); max-width: 24em;
}
.reply .w {
  display: inline-block; opacity: 0; transform: translateY(.6em); filter: blur(6px);
  background: linear-gradient(100deg, #ffffff 10%, #dcd8ff 60%, #b9c4ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: word .6s var(--ease) forwards;
}
@keyframes word { to { opacity: 1; transform: none; filter: blur(0); } }
.thinking-dots[hidden], .wave[hidden] { display: none; }
.wave { display: flex; align-items: center; gap: .55vh; height: 12vh; margin-top: 4vh; }
.wave i { width: .7vh; border-radius: 1vh; height: 6%; background: linear-gradient(180deg, var(--c1), var(--c2)); transition: height .1s linear; }
.thinking-dots { display: inline-flex; gap: 1.6vh; margin-top: 4.5vh; }
.thinking-dots i { width: 1.8vh; height: 1.8vh; border-radius: 50%; background: var(--c2); animation: dot 1.2s ease-in-out infinite; opacity: .3; }
.thinking-dots i:nth-child(2) { animation-delay: .15s; } .thinking-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 40% { opacity: 1; transform: translateY(-1vh); } }

/* idle */
.greet { font-family: var(--mono); font-size: 2vh; letter-spacing: .32em; text-transform: uppercase; color: var(--ink-3); }
.clock-big {
  font-size: 19vh; font-weight: 200; letter-spacing: -.04em; line-height: 1; margin-top: 1.5vh;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #ffffff, #b8bdf0 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.date { font-size: 3vh; font-weight: 300; color: var(--ink-2); margin-top: 1.2vh; text-transform: capitalize; }
.hint { margin-top: 4.5vh; }
.pill[hidden] { display: none; }
.hint .pill { font-size: 1.8vh; padding: 1.2vh 2.2vh; color: var(--ink); }
.hint b { color: var(--cyan); font-weight: 500; }
.mic { width: 2.2vh; height: 2.2vh; fill: var(--cyan); }

/* ------------------------------------------------------------------ history */
footer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; min-height: 14vh; }
.card {
  padding: 2vh 2.4vh; border-radius: 2.2vh; border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(150, 160, 255, .06), rgba(150, 160, 255, .02));
  animation: rise .8s var(--ease) both;
  min-width: 0;
}
@keyframes rise { from { opacity: 0; transform: translateY(2vh); } }
.card .meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 1.35vh; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
.card .meta .src { color: var(--c1); }
.card .q { margin-top: 1.1vh; font-size: 1.9vh; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .a { margin-top: .7vh; font-size: 2.15vh; line-height: 1.35; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* unlock audio (browser with ?audio=1) */
.unlock { position: fixed; right: 3vw; bottom: 3vh; display: none; cursor: pointer; }
.unlock.show { display: inline-flex; }

@media (max-aspect-ratio: 1/1) {
  main { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 4vh; }
  .heard, .reply { margin-left: auto; margin-right: auto; }
  footer { grid-template-columns: 1fr; }
  footer .card:nth-child(n+2) { display: none; }
  :root { --orb: 34vh; }
  .clock-big { font-size: 14vh; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body data-state="idle">
<div class="sky"></div>
<div class="stage" id="stage">
  <header>
    <div class="brand"><span class="mark"></span><span class="name">HERMES</span></div>
    <div class="top-right">
      <span class="clock-small" id="clockSmall"></span>
      <span class="pill" id="conn"><span class="dot"></span><span id="connText"></span></span>
    </div>
  </header>

  <main>
    <div class="orb" id="orb">
      <div class="halo"></div>
      <div class="ripple a"></div><div class="ripple b"></div><div class="ripple c"></div>
      <div class="ring"></div>
      <div class="ring two"></div>
      <div class="core"><i class="blob a"></i><i class="blob b"></i><i class="blob c"></i><i class="shine"></i></div>
      <div class="orbit"><i></i></div>
      <div class="orbit b"><i></i></div>
    </div>
    <canvas class="avatar" id="avatar" aria-hidden="true"></canvas>

    <div class="copy">
      <section class="panel" id="pIdle">
        <div class="greet" id="greet"></div>
        <div class="clock-big" id="clockBig"></div>
        <div class="date" id="date"></div>
        <div class="hint"><span class="pill" id="hint"></span><span class="pill soft" id="hint2" hidden></span></div>
      </section>
      <section class="panel" id="pLive" hidden>
        <div class="label"><span class="bars"><i></i><i></i><i></i><i></i></span><span id="label"></span></div>
        <div class="heard" id="heard"></div>
        <div class="wave" id="wave" hidden></div>
        <div class="thinking-dots" id="dots" hidden><i></i><i></i><i></i></div>
        <div class="reply" id="reply"></div>
      </section>
    </div>
  </main>

  <footer id="history"></footer>
</div>
<button class="pill unlock" id="unlock"></button>

<script src="avatar.js"></script>
<script>
(() => {
  "use strict";
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const lang = (q.get("lang") || navigator.language || "fr").slice(0, 2) === "en" ? "en" : "fr";
  const app = q.has("app") || !!window.HermesApp;            // inside the Android TV app
  const playAll = q.get("audio") === "1";                     // browser: also speak the replies here
  const wake = q.get("wake") || "Alexa";
  const name = q.get("name") || "";

  const T = {
    fr: { listening: "À l'écoute", transcribing: "Transcription", thinking: "Réflexion", speaking: "Hermes répond",
          error: "Oups", nothing: "Je n'ai rien entendu", down: "Hermes est injoignable",
          live: "En direct", connecting: "Connexion", echo: "Echo", tv: "TV",
          morning: "Bonjour", evening: "Bonsoir", sayWake: (w) => `Dites <b>« ${w} »</b>`,
          press: `Appuyez sur ${micSvg()} ou <b>OK</b> pour parler`, release: "Relâchez ou appuyez pour envoyer",
          sound: "Activer le son", settings: "▼ Réglages", locale: "fr-FR" },
    en: { listening: "Listening", transcribing: "Transcribing", thinking: "Thinking", speaking: "Hermes says",
          error: "Oops", nothing: "I didn't catch that", down: "Hermes can't be reached",
          live: "Live", connecting: "Connecting", echo: "Echo", tv: "TV",
          morning: "Good morning", afternoon: "Good afternoon", evening: "Good evening", sayWake: (w) => `Say <b>“${w}”</b>`,
          press: `Press ${micSvg()} or <b>OK</b> to talk`, release: "Release or press again to send",
          sound: "Enable sound", settings: "▼ Settings", locale: "en-GB" },
  }[lang];
  document.documentElement.lang = lang;
  function micSvg() { return '<svg class="mic" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>'; }
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // ------------------------------------------------------------- clock + idle drift (OLED care)
  function tick() {
    const d = new Date();
    const hm = d.toLocaleTimeString(T.locale, { hour: "2-digit", minute: "2-digit" });
    $("clockBig").textContent = hm; $("clockSmall").textContent = hm;
    $("date").textContent = d.toLocaleDateString(T.locale, { weekday: "long", day: "numeric", month: "long" });
    const h = d.getHours();
    const g = lang === "fr" ? (h >= 18 || h < 5 ? T.evening : T.morning)
                            : (h < 12 && h >= 5 ? T.morning : h < 18 && h >= 5 ? T.afternoon : T.evening);
    $("greet").textContent = name ? `${g}, ${name}` : g;
  }
  tick(); setInterval(tick, 1000);
  setInterval(() => {
    const s = $("stage");
    s.style.transform = state === "idle" ? `translate(${(Math.random() - .5) * 1.6}vh, ${(Math.random() - .5) * 1.6}vh)` : "";
  }, 60000);

  // ------------------------------------------------------------- state
  let state = "idle", turn = null, history = [], idleTimer = null;
  const hintIdle = () => app ? T.press : T.sayWake(wake);
  $("hint").innerHTML = hintIdle();
  if (app) { $("hint2").hidden = false; $("hint2").innerHTML = T.settings; }

  function setState(s) {
    state = s; document.body.dataset.state = s;
    const idle = s === "idle";
    $("pIdle").hidden = !idle; $("pLive").hidden = idle;
    if (idle) { renderHistory(); level.target = 0; }
  }

  const BARS = 56;
  $("wave").innerHTML = "<i></i>".repeat(BARS);
  const bars = [...$("wave").children], waveHist = new Array(BARS).fill(0);
  function show({ label, heard = "", reply = "", dots = false, duration = 0, wave = false }) {
    $("label").textContent = label;
    $("wave").hidden = !wave;
    $("heard").textContent = heard;
    $("dots").hidden = !dots;
    const r = $("reply");
    r.innerHTML = "";
    if (reply) {
      const words = reply.split(/\s+/);
      const n = reply.length;
      r.style.setProperty("--reply-size", n < 70 ? "6.4vh" : n < 140 ? "5.2vh" : n < 240 ? "4.2vh" : "3.5vh");
      const span = Math.min(Math.max((duration || words.length * .32) * .85, 1.2), 14);
      r.innerHTML = words.map((w, i) => `<span class="w" style="animation-delay:${(i / words.length * span).toFixed(2)}s">${esc(w)}</span>`).join(" ");
    }
  }

  function renderHistory() {
    const items = history.filter((h) => !(state !== "idle" && h.id === turn)).slice(-3).reverse();
    $("history").innerHTML = items.map((h, i) => `
      <div class="card" style="animation-delay:${i * .08}s">
        <div class="meta"><span class="src">${esc(T[h.source] || h.source)}</span><span>${new Date(h.ts * 1000).toLocaleTimeString(T.locale, { hour: "2-digit", minute: "2-digit" })}</span></div>
        <div class="q">${esc(h.heard)}</div>
        <div class="a">${esc(h.text)}</div>
      </div>`).join("");
  }

  function backToIdleIn(sec) { clearTimeout(idleTimer); idleTimer = setTimeout(() => setState("idle"), sec * 1000); }

  // events from the bridge (and, in the app, from the TV itself)
  function onEvent(ev) {
    switch (ev.type) {
      case "hello":
        history = ev.history || []; renderHistory();
        avatarReady.then(() => applyLook(ev)); break;
      case "listening":
        clearTimeout(idleTimer); turn = ev.id;
        setState("listening"); show({ label: T.listening, heard: ev.partial || "", wave: true }); renderHistory(); break;
      case "thinking":
        clearTimeout(idleTimer); turn = ev.id || turn;
        setState("thinking"); show({ label: ev.heard ? T.thinking : T.transcribing, heard: ev.heard, dots: true }); level.target = 0; break;
      case "reply":
        clearTimeout(idleTimer); turn = ev.id;
        history = history.filter((h) => h.id !== ev.id).concat([{ id: ev.id, source: ev.source, heard: ev.heard, text: ev.text, ts: ev.ts }]).slice(-12);
        setState("speaking"); show({ label: T.speaking, heard: ev.heard, reply: ev.text, duration: ev.duration }); renderHistory();
        if (playAll && ev.audio) play(ev.audio);
        else synthSpeech(ev.duration || 4);
        backToIdleIn((ev.duration || 4) + 12); break;                // the bridge also sends idle; this is a safety net
      case "idle":
        if (!ev.id || ev.id === turn) backToIdleIn(state === "speaking" ? 6 : 0.1); break;
      case "error":
        setState("error"); show({ label: T.error, heard: ev.message === "nothing heard" ? T.nothing : ev.message === "bridge error" ? T.down : (ev.message || T.down) });
        level.target = 0; backToIdleIn(4); break;
    }
  }

  // ------------------------------------------------------------- orb level (voice + speech)
  const level = { v: 0, target: 0, analyser: null, buf: null, synthUntil: 0 };
  function synthSpeech(sec) { level.synthUntil = performance.now() + sec * 1000; }
  function frame(t) {
    let target = level.target;
    if (level.analyser) {
      level.analyser.getByteTimeDomainData(level.buf);
      let sum = 0; for (const x of level.buf) { const v = (x - 128) / 128; sum += v * v; }
      target = Math.max(target, Math.min(1, Math.sqrt(sum / level.buf.length) * 4));
    } else if (t < level.synthUntil) {
      target = Math.max(target, .25 + .35 * Math.abs(Math.sin(t / 130) * Math.sin(t / 370 + 1.3)));
    }
    level.v += (target - level.v) * (target > level.v ? .45 : .12);
    $("orb").style.setProperty("--level", level.v.toFixed(3));
    if (avatar) avatar.frame(t, state === "error" ? "error" : state, level.v);
    if (state === "listening" && t - (frame.last || 0) > 60) {
      frame.last = t; waveHist.push(level.v); waveHist.shift();
      bars.forEach((b, i) => { const v = waveHist[i] * (0.55 + 0.45 * Math.sin(i * 1.7 + t / 90) ** 2); b.style.height = (6 + v * 94).toFixed(1) + "%"; });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ------------------------------------------------------------- audio playback (app, or ?audio=1)
  let ctx = null;
  function play(path) {
    return new Promise((resolve) => {
      const a = new Audio(new URL(path, location.origin).href);
      a.crossOrigin = "anonymous";
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaElementSource(a), an = ctx.createAnalyser();
        an.fftSize = 512; src.connect(an); an.connect(ctx.destination);
        level.analyser = an; level.buf = new Uint8Array(an.fftSize);
        if (ctx.state === "suspended") ctx.resume();
      } catch (e) { synthSpeech(8); }
      const done = () => { level.analyser = null; resolve(); window.HermesApp?.onPlaybackDone?.(); };
      a.onended = done; a.onerror = done;
      a.play().catch(() => { done(); if (!app) { $("unlock").classList.add("show"); } });
    });
  }
  $("unlock").textContent = T.sound;
  $("unlock").onclick = () => { $("unlock").classList.remove("show"); ctx = ctx || new AudioContext(); ctx.resume(); };

  // ------------------------------------------------------------- avatar (?avatar=medallion|spectrum|hologram|orb, &ink=white|black)
  let avatar = null, avatarData = null, look = { avatar: q.get("avatar"), ink: q.get("ink") };
  function applyLook(defaults) {
    const style = look.avatar || (defaults && defaults.avatar) || "orb";
    const ink = look.ink || (defaults && defaults.ink) || "white";
    if (style === "orb" || !avatarData || !window.HermesAvatar) { avatar = null; document.body.classList.remove("has-avatar"); return; }
    avatar = HermesAvatar.create($("avatar"), avatarData, { style, ink });
    document.body.classList.add("has-avatar");
  }
  const avatarReady = fetch(new URL("avatar.json", location.href)).then((r) => r.ok ? r.json() : null)
    .then((d) => { avatarData = d; }).catch(() => {});

  // ------------------------------------------------------------- connection to the bridge
  function setConn(ok) {
    $("conn").classList.toggle("off", !ok);
    $("connText").textContent = ok ? T.live : T.connecting;
  }
  function connect() {
    if (q.has("demo")) return demo(q.get("demo"));
    setConn(false);
    const params = q.get("token") ? `?token=${encodeURIComponent(q.get("token"))}` : "";
    const es = new EventSource(new URL("/events" + params, location.origin));
    es.onopen = () => setConn(true);
    es.onerror = () => setConn(false);
    es.onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch (e) { console.warn(e); } };
  }

  // ------------------------------------------------------------- API for the Android TV app
  window.HermesScreen = {
    event: onEvent,                                     // HermesScreen.event({type: "listening", id, source: "tv"})
    level: (x) => { level.target = Math.max(0, Math.min(1, +x || 0)); },
    play,                                               // HermesScreen.play("/tts/....wav")
    hint: (html) => { $("hint").innerHTML = html || hintIdle(); },
    strings: T,
    look: (style, ink) => { look = { avatar: style || null, ink: ink || null }; avatarReady.then(() => applyLook()); },
  };

  // ------------------------------------------------------------- demo (?demo=1, or a frozen state)
  function demo(which) {
    setConn(true);
    avatarReady.then(() => applyLook());
    const now = Date.now() / 1000;
    const S = lang === "fr" ? [
      ["Combien de conteneurs tournent sur Proxmox ?", "Douze conteneurs tournent en ce moment. Le plus gourmand est Jellyfin, à 38 % de CPU."],
      ["Rappelle-moi de sortir les poubelles à 20 heures", "C'est noté, je te le rappelle à 20 heures."],
      ["Il fait combien dehors ?", "Il fait 9 degrés à Lyon, avec un ciel couvert. Pense à prendre une veste."],
      ["Lance une sauvegarde de Home", "Sauvegarde du conteneur 118 lancée vers le NAS. Je te préviens quand c'est terminé."],
    ] : [
      ["How many containers are running on Proxmox?", "Twelve containers are running right now. The busiest is Jellyfin, at 38 percent CPU."],
      ["Remind me to take the bins out at 8 pm", "Done, I'll remind you at 8 pm."],
      ["What's the weather like outside?", "It's 9 degrees and cloudy. You'll want a jacket."],
      ["Back up the home server", "Backup of container 118 started to the NAS. I'll tell you when it's done."],
    ];
    history = S.slice(1).map(([h, t], i) => ({ id: "d" + i, source: i % 2 ? "tv" : "echo", heard: h, text: t, ts: now - 600 * (i + 1) })).reverse();
    const [heard, text] = S[0];
    const frozen = { idle: () => setState("idle"),
      listening: () => { onEvent({ type: "listening", id: "x", source: "tv" }); setInterval(() => level.target = .3 + Math.random() * .6, 120); },
      thinking: () => onEvent({ type: "thinking", id: "x", source: "echo", heard }),
      reply: () => { onEvent({ type: "reply", id: "x", source: "echo", heard, text, ts: now, duration: 3 }); clearTimeout(idleTimer); synthSpeech(1e6); },
      error: () => onEvent({ type: "error", id: "x", message: "nothing heard" }) };
    if (frozen[which]) { renderHistory(); return frozen[which](); }
    renderHistory();
    let i = 0;
    const loop = () => {
      const [h, t] = S[i++ % S.length];
      const id = "l" + i;
      onEvent({ type: "listening", id, source: "echo" });
      const talk = setInterval(() => level.target = .2 + Math.random() * .7, 110);
      setTimeout(() => { clearInterval(talk); level.target = 0; onEvent({ type: "thinking", id, source: "echo", heard: h }); }, 2600);
      setTimeout(() => onEvent({ type: "reply", id, source: "echo", heard: h, text: t, ts: Date.now() / 1000, duration: 5 }), 5200);
      setTimeout(() => onEvent({ type: "idle", id }), 11000);
      setTimeout(loop, 21000);
    };
    setTimeout(loop, 3000);
  }

  setState("idle");
  connect();
})();
</script>
</body>
