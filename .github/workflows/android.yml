name: Android TV app

on:
  push:
    paths: ["android-tv/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-tv/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships the Android SDK; Gradle fetches any missing platform itself.
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: mv app/build/outputs/apk/release/app-release.apk hermes-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-tv-apk
          path: android-tv/hermes-tv.apk
          if-no-files-found: error
