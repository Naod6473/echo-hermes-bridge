name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Whisper and Piper are stubbed by the test, so only the light dependencies are needed.
      - run: pip install "aioesphomeapi==46.28.0" "aiohttp>=3.9" numpy ruff
      - run: ruff check --select E9,F bridge.py cleanup.py tests/
      - run: bash -n install.sh && bash -n deploy/proxmox-lxc.sh && sh -n docker/entrypoint.sh
      - run: python tests/fake_echo_test.py
